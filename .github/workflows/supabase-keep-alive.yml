name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 9 * * 5" # Every Friday at 09:00 AM UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Edge Function
        run: |
          if [ -z "$SUPABASE_KEEP_ALIVE_URL" ]; then
            echo "::error::SUPABASE_KEEP_ALIVE_URL secret is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Pinging keep-alive URL..."
          # GitHub Actions uses `bash -e`, so we must prevent `curl` non-zero exit codes from aborting
          # the step early; treat failures as HTTP `000` for consistent handling.
          status=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$SUPABASE_KEEP_ALIVE_URL" || echo "000")
          echo "Response: HTTP $status"
          if [ "$status" = "000" ]; then
            echo "::error::Request failed (no response or connection error)"
            exit 1
          fi
        env:
          SUPABASE_KEEP_ALIVE_URL: ${{ secrets.SUPABASE_KEEP_ALIVE_URL }}
